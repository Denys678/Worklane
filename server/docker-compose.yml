services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: 5001
      DATABASE_URL: postgresql://taskflow_user:taskflow_password@db:5432/taskflow?schema=public

    ports:
      - "5001:5001"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password

    ports:
      - "5434:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskflow_postgres_data: